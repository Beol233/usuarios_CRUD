<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     <h1>Lista de Usuarios</h1>
    <table border="1">
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>Email</th>
            <th>Acciones</th>
        </tr>
        {% for usuario in usuarios %}
        <tr>
            <td>{{ usuario.id }}</td>
            <td>{{ usuario.nombre }}</td>
            <td>{{ usuario.apellido }}</td>
            <td>{{ usuario.email }}</td>
            <td>
                <a href="/usuarios/{{ usuario.id }}">Ver</a> 
                <a href="/usuarios/editar/{{ usuario.id }}">Editar</a> 
                <a href="/usuarios/eliminar/{{ usuario.id }}" onclick="return confirm('¿Seguro?')">Eliminar</a>
            </td>
        </tr>
        {% else %}
        <tr>
            <td colspan="5">No hay usuarios registrados.</td>
        </tr>
        {% endfor %}
    </table>
    <br>
    <a href="/usuarios/nuevo">Agregar Nuevo Usuario</a>

</body>
</html>
